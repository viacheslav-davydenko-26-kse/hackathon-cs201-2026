<!doctype html>
<!-- Власник: Андрій. -->
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ДеЦе? Live — Соло</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">ДеЦе?<span> Live</span></div>
      <div class="stat">
        <span class="stat__label">Бали</span>
        <span class="stat__value" id="score">0</span>
      </div>
    </header>

    <main class="layout">
      <!-- карту рендерить map.js -->
      <section class="map-area" id="map">
        <p class="muted">Карта завантажується…</p>
      </section>

      <aside class="side">
        <!-- результат раунду: solo.js показує після finished -->
        <section class="panel result" id="result" hidden>
          <h2 class="result__title" id="result-title"></h2>
          <p id="result-text"></p>
          <button class="btn btn--primary btn--block" id="next-round" type="button">Ще раунд</button>
        </section>

        <section class="panel">
          <h2 class="panel__title">Підказки</h2>
          <!-- solo.js заповнює список -->
          <ol class="hints" id="hints"></ol>
        </section>

        <button class="btn btn--block" id="more-hint" type="button">Ще підказка</button>

        <section class="panel">
          <h2 class="panel__title">Спроби <span class="muted" id="attempts-left"></span></h2>
          <!-- solo.js показує результат кожної спроби -->
          <ol class="attempts" id="attempts"></ol>
          <p class="muted" id="attempts-empty">Клікни на область на карті</p>
        </section>

        <p class="error" id="error" hidden></p>

        <!-- картка області (card.js, Матвій) -->
        <section class="panel" id="card" hidden></section>
      </aside>
    </main>
  </div>

  <script type="module" src="/static/js/solo.js"></script>
</body>
</html>
