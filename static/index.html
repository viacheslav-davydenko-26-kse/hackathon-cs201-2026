<!doctype html>
<!-- Власник: Андрій. -->
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ДеЦе? Live — Соло</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230057b8'/%3E%3Cpath d='M12 5a5 5 0 0 0-5 5c0 3.5 5 9 5 9s5-5.5 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z' fill='%23ffd34d'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo"><span class="logo__mark"><i data-icon="map-pin"></i></span>ДеЦе?<span class="logo__accent">Live</span></div>
      <div class="topbar__right">
        <span class="pill" id="round-label">Раунд 1</span>
        <span class="score" title="Бали за сесію">
          <i data-icon="trophy"></i>
          <span id="score">0</span>
        </span>
      </div>
    </header>

    <main class="layout">
      <section class="map-area">
        <div class="map-wrap" id="map" aria-busy="true">
          <!-- скелетон, поки вантажиться карта; map.js замінить вміст -->
          <div class="skeleton skeleton-map" aria-label="Карта завантажується"></div>
        </div>
        <!-- легенда «гаряче/холодно»: відстань від твоєї відповіді до правильної -->
        <ul class="legend" aria-label="Легенда відстаней">
          <li class="legend__item"><span class="legend__swatch" style="background: var(--heat-hot)"></span>до 150 км</li>
          <li class="legend__item"><span class="legend__swatch" style="background: var(--heat-warm)"></span>150–300 км</li>
          <li class="legend__item"><span class="legend__swatch" style="background: var(--heat-cool)"></span>300–500 км</li>
          <li class="legend__item"><span class="legend__swatch" style="background: var(--heat-cold)"></span>понад 500 км</li>
        </ul>
      </section>

      <aside class="side">
        <!-- результат раунду: solo.js показує після finished -->
        <section class="panel result" id="result" hidden>
          <div class="result__head">
            <span class="result__icon" id="result-icon"></span>
            <div>
              <h2 class="result__title" id="result-title"></h2>
              <p class="result__sub" id="result-text"></p>
            </div>
          </div>
          <button class="btn btn--primary btn--block" id="next-round" type="button">
            <i data-icon="rotate-ccw"></i>Ще раунд
          </button>
        </section>

        <section class="panel">
          <div class="panel__head">
            <h2 class="panel__title"><i data-icon="lightbulb"></i>Підказки</h2>
            <span class="pill pill--accent" id="hints-count"></span>
          </div>
          <!-- solo.js заповнює список -->
          <ol class="hints" id="hints">
            <li class="skeleton skeleton--block"></li>
            <li class="skeleton skeleton--block"></li>
            <li><div class="skeleton skeleton--line"></div><div class="skeleton skeleton--line skeleton--short"></div></li>
          </ol>
        </section>

        <button class="btn btn--block" id="more-hint" type="button">
          <i data-icon="lightbulb"></i>Ще підказка<span class="btn__hint" id="more-hint-mult"></span>
        </button>

        <section class="panel">
          <div class="panel__head">
            <h2 class="panel__title"><i data-icon="target"></i>Спроби</h2>
            <span class="dots" id="attempts-dots" title="Залишок спроб"></span>
          </div>
          <!-- solo.js показує результат кожної спроби -->
          <ol class="attempts" id="attempts"></ol>
          <p class="empty" id="attempts-empty"><i data-icon="map-pin"></i>Клікни на область на карті</p>
        </section>

        <p class="error" id="error" hidden></p>

        <!-- картка області (card.js, Матвій) -->
        <section class="panel" id="card" hidden></section>
      </aside>
    </main>
  </div>

  <script type="module" src="/static/js/solo.js?v=2"></script>
</body>
</html>
